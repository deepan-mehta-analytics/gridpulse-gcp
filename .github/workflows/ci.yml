# ── GridPulse CI — runs on every pull request against main ─────────
name: CI                                  # workflow display name in GitHub Actions UI

on:
  pull_request:                           # run on every PR
    branches: [main]                      # only against the main branch

jobs:
  lint-and-validate:                      # single job for Phase 0's lightweight check set
    runs-on: ubuntu-latest                # standard GitHub-hosted runner, free tier

    steps:
      - name: Checkout repository          # pull the PR's code
        uses: actions/checkout@v4

      - name: Set up Python                # Phase 0 has no Python code yet, but pin the version now
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"          # matches repo CLAUDE.md floor

      - name: Set up Terraform             # for fmt/validate checks
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"      # matches repo CLAUDE.md floor

      - name: Terraform format check        # fails if any .tf file isn't canonically formatted
        run: terraform fmt -check -recursive infra/terraform

      - name: Terraform init (no backend)   # local validation only, no state, no credentials needed
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validate            # confirms HCL syntax and internal references
        run: terraform -chdir=infra/terraform validate

      - name: Compose config check          # confirms docker-compose.yml parses
        run: docker compose config --quiet

      # Dataform compile step is added once transform/dataform/ has real
      # SQLX files (Phase 3) — not present yet, so intentionally omitted
      # rather than stubbed with a fake step.
