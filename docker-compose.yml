# ── GridPulse local emulator stack ──────────────────────────────
# Every managed GCP service used by this repo has a free local twin here.
# Real GCP is only touched via `make cloud-up`, gated on a budget alert.
services:
  # ── Messaging ──────────────────────────────────────────────────
  pubsub-emulator:                        # local twin of Cloud Pub/Sub
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators  # official GCP emulator image
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085  # start Pub/Sub emulator on 8085
    ports:
      - "127.0.0.1:8085:8085"             # loopback-only: never expose emulators to the LAN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085"]  # emulator responds on its own port
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ingestion (Phase 1) ──────────────────────────────────────────
  bmrs-collector:                         # local twin of the Cloud Run BMRS collector
    build:
      context: .
      dockerfile: ingest/collectors/bmrs/Dockerfile
    depends_on:
      pubsub-emulator:
        condition: service_healthy         # topics/schema get created on startup, needs the emulator up first
    environment:
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085  # route the client library at the emulator, not real GCP
      GCP_PROJECT_ID: gridpulse-local
    profiles: ["seed"]                    # one-shot job — only runs via `docker compose run`, never `up`

  # ── Wide-column ────────────────────────────────────────────────
  bigtable-emulator:                      # local twin of Cloud Bigtable
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators bigtable start --host-port=0.0.0.0:8086  # start Bigtable emulator on 8086
    ports:
      - "127.0.0.1:8086:8086"             # loopback-only: never expose emulators to the LAN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Global relational (comparison/ADR only, not wired to pipeline) ─
  spanner-emulator:                       # local twin of Cloud Spanner
    image: gcr.io/cloud-spanner-emulator/emulator  # official Spanner emulator image
    ports:
      - "127.0.0.1:9010:9010"             # gRPC endpoint, loopback-only
      - "127.0.0.1:9020:9020"             # REST endpoint, loopback-only

  # ── OLTP (synthetic fleet/asset data for CDC exercises) ──────────
  postgres:                               # local twin of Cloud SQL
    image: postgres:16                    # pinned major version
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium's Postgres connector requires logical WAL for CDC (default is replica); wired in Phase 1
    environment:
      POSTGRES_USER: gridpulse            # non-default app user, not a real credential
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridpulse_local_pg}  # read from .env, falls back to the same local-only dev default
      POSTGRES_DB: gridpulse_ops           # synthetic operational schema database — the one Debezium CDC-watches
    ports:
      - "127.0.0.1:5432:5432"             # loopback-only: never expose the local DB to the LAN
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d  # runs 01-create-airflow-db.sql on first (fresh) container start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridpulse"]  # wait for Postgres to accept connections
      interval: 10s
      timeout: 5s
      retries: 5

  # ── CDC ───────────────────────────────────────────────────────
  debezium:                               # local twin of Datastream
    image: debezium/connect:2.7           # Debezium Kafka Connect image
    depends_on:
      postgres:
        condition: service_healthy         # wait for Postgres before starting CDC
    # Kafka Connect's REST API (8083) has no authentication of its own and accepts
    # arbitrary connector configs over plain HTTP — a known RCE/config-disclosure
    # surface if ever exposed beyond loopback. Loopback-only binding below is
    # load-bearing, not just convention: do not widen this to 0.0.0.0.
    ports:
      - "127.0.0.1:8083:8083"             # Kafka Connect REST API, loopback-only (no built-in auth)
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"      # placeholder broker — wired when CDC becomes its own phase (deferred past Phase 1, see docs/superpowers/specs/2026-08-16-gridpulse-phase1-stream-ingest-design.md §3)
      GROUP_ID: "gridpulse-cdc"
      CONFIG_STORAGE_TOPIC: "gridpulse_connect_configs"
      OFFSET_STORAGE_TOPIC: "gridpulse_connect_offsets"

  # ── Object store ──────────────────────────────────────────────
  minio:                                  # local twin of Google Cloud Storage
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z  # pinned release, current as of this fix — supersedes 2024-01-16 tag which predates the CVE-2024-24747 privilege-escalation fix
    command: server /data --console-address ":9001"  # start MinIO with web console
    environment:
      MINIO_ROOT_USER: gridpulse           # local-only credential, never real GCS
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gridpulse_local_minio}  # read from .env, falls back to the same local-only dev default
    # The console (9001) is backed by the root credentials above, but loopback-only
    # binding is still deliberate, not incidental: it's the only thing standing
    # between the console and anyone else on the same network segment.
    ports:
      - "127.0.0.1:9000:9000"             # S3-compatible API, loopback-only
      - "127.0.0.1:9001:9001"             # web console, loopback-only (root-credential-backed, binding is deliberate)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Batch/Spark ───────────────────────────────────────────────
  spark:                                  # local twin of Dataproc Serverless
    image: bitnami/spark:3.5              # pinned Spark image
    environment:
      SPARK_MODE: master                  # run as a standalone Spark master
    # Loopback-only binding below is load-bearing, not just convention: the Spark web UI
    # (8080) has no built-in authentication in this image — do not widen these to 0.0.0.0.
    ports:
      - "127.0.0.1:7077:7077"             # Spark master port, loopback-only
      - "127.0.0.1:8080:8080"             # Spark web UI, loopback-only (UI has no built-in auth)

  # ── Orchestration ─────────────────────────────────────────────
  airflow:                                # local twin of Cloud Composer
    image: apache/airflow:2.10.4          # pinned Airflow version
    command: ["standalone"]               # airflow's own single-command local-dev mode: runs db migrate, creates an admin user, and serves webserver+scheduler+triggerer together (LocalExecutor needs a scheduler process for DAG runs to actually execute)
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor  # single-node executor, fine for local dev
      # Deliberately a DIFFERENT database (gridpulse_airflow) from gridpulse_ops:
      # gridpulse_ops is the schema Debezium CDC-watches (synthetic fleet/asset
      # data, see docs/data-sources.md + ADR 0003). Pointing Airflow's own
      # metadata store at that same DB would mean Debezium captures Airflow's
      # internal tables (dag_run, task_instance, xcom, ...) as CDC events,
      # polluting the exact exercise gridpulse_ops exists for. The standard
      # postgres image only auto-creates the DB named in POSTGRES_DB above
      # (gridpulse_ops), so gridpulse_airflow does not exist yet — creating it
      # is Phase 1 Postgres init-script work, alongside the rest of Airflow's
      # webserver wiring (DB migration, admin user, entrypoint command).
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://gridpulse:${POSTGRES_PASSWORD:-gridpulse_local_pg}@postgres/gridpulse_airflow"
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085  # bmrs_dlq_replay's pubsub_v1 clients route here instead of real GCP (same var bmrs-collector uses above)
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_healthy         # replay_dlq_messages talks to the emulator at task-run time, needs it up first
    ports:
      - "127.0.0.1:8081:8080"             # Airflow webserver, loopback-only (8080 already used by Spark UI)
    volumes:
      - ./orchestrate/dags:/opt/airflow/dags  # mount DAGs from the repo
      - ./ingest:/opt/airflow/dags/ingest:ro  # bmrs_dlq_replay_dag.py's replay_logic imports ingest.contracts.pubsub_setup; mounted read-only, next to the DAG so it lands on Airflow's dag-folder sys.path entry
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
